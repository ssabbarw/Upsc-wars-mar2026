name: upsc_wars_new
description: "UPSC Wars - Educational App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Localisation
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # Local database — primary data store
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.1

  # Simple key-value store — used only for lightweight settings (e.g. theme mode).
  # Not intended for feature data; use sqflite for that.
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation for Riverpod
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0

  # Riverpod-specific linting rules
  custom_lint: ^0.7.0
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/questions/en/ancient_history/
    - assets/questions/en/art_and_culture/
    - assets/questions/en/economy/
    - assets/questions/en/environment/
    - assets/questions/en/geography/
    - assets/questions/en/medieval_history/
    - assets/questions/en/modern_history/
    - assets/questions/en/polity/
